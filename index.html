<!DOCTYPE html>
<html lang="ur"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atfal-e-Millat, Little Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--green:#0A5C3A;--yellow:#FFCF2E;--yellow-soft:#FFF1B8;--page:#FFF8DC;--card:#FFFFFF;--ink:#16231C;--muted:#4F6459;--line:#E6D98F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{--page:#0B1F17;--card:#10291F;--ink:#F4F0DA;--muted:#B9C9BE;--line:#2E4A3B;--yellow-soft:#2A3A1A}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:0 0 32px}
header{background:var(--green);color:#fff;padding:22px 20px 56px;border-radius:0 0 28px 28px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:12px;background:var(--yellow);border-radius:0 0 28px 28px;z-index:0}
.book{margin:0;font-size:.95rem;font-weight:600;color:var(--yellow)}
h1{margin:6px 0 0;font-size:2.1rem;line-height:1.1;font-weight:800}
.ref{margin:10px 0 0;font-size:1rem;opacity:.95}
main{padding:0 16px;margin-top:-34px;position:relative;z-index:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 18px}
.arabic{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;text-align:center;font-size:2rem;line-height:2.3;margin:0}
.rule{height:0;border:0;border-top:2px dashed var(--line);margin:18px 0}
.label{margin:0 0 8px;font-size:.95rem;font-weight:600;color:var(--muted)}
.urdu{font-family:"Noto Nastaliq Urdu","Amiri",serif;direction:rtl;text-align:right;font-size:1.28rem;line-height:2.45;margin:0}
.n{margin:0 0 4px;font-size:.85rem;color:var(--muted)}
.who{margin:16px 4px 0;font-size:.85rem;color:var(--muted)}
footer{margin:22px 16px 0;padding:14px 16px;background:var(--yellow-soft);border-radius:16px;font-size:.9rem}
@media (max-width:380px){.arabic{font-size:1.7rem}.urdu{font-size:1.15rem}h1{font-size:1.8rem}}
</style></head><body><div class="wrap"><header><p class="book">Millat Educational Trust</p><h1>Little Artist</h1><p class="ref">Atfal-e-Millat, Book 1</p></header><main><section class="card"><p class="label">Is kitab ke QR code scan karke ayat aur Urdu tarjuma dekhein.</p></section><footer>Millat Educational Trust, Anjangaon Surji, Amravati</footer></main></div></body></html>
